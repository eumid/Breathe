<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breathe — приём лекарств</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Breathe">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#f4f6f6; --card:#fff; --ink:#111c1a; --muted:#5d6b69; --line:#e2e7e6;
  --accent:#0f766e; --accent-soft:#e6f2f0; --warn:#b45309; --warn-soft:#fdf3e3;
  --stop:#b91c1c; --stop-soft:#fdeceb; --done:#0f766e;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1413; --card:#161e1d; --ink:#e8efee; --muted:#93a3a1; --line:#26312f;
    --accent:#4ade9f; --accent-soft:#16302a; --warn:#fbbf24; --warn-soft:#2e2410;
    --stop:#f87171; --stop-soft:#2e1616; --done:#4ade9f;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:28px 0 10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 0 4px;position:sticky;top:0;background:var(--bg);z-index:5}
.day-nav{display:flex;align-items:center;gap:6px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.nav-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:16px;line-height:1;display:grid;place-items:center}
.nav-btn:disabled{opacity:.3}
.date-line{font-size:13px;color:var(--muted);margin-top:2px}
.today-btn{font-size:13px;color:var(--accent);padding:6px 10px;border-radius:9px;background:var(--accent-soft)}

.banner{border-radius:var(--radius);padding:12px 14px;margin:12px 0;font-size:14px;line-height:1.4}
.banner b{display:block;margin-bottom:2px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.stop{background:var(--stop-soft);color:var(--stop)}
.banner.info{background:var(--accent-soft);color:var(--accent)}

ul{list-style:none;margin:0;padding:0}
.slot{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .time{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;
  min-width:46px;padding-top:3px;color:var(--muted)}
.slot .body{flex:1;min-width:0}
.slot .name{font-weight:600;font-size:15px;letter-spacing:-.01em}
.slot .sub{font-size:13px;color:var(--muted);margin-top:2px}
.slot.done .name,.slot.done .sub{opacity:.45}
.slot.done .name{text-decoration:line-through}
.tick{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);
  background:var(--card);display:grid;place-items:center;transition:.12s;margin-top:1px}
.tick svg{width:15px;height:15px;stroke:var(--card);stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0}
.slot.done .tick{background:var(--done);border-color:var(--done)}
.slot.done .tick svg{opacity:1}
.slot.now{background:var(--accent-soft)}
.slot.now .time{color:var(--accent)}

.med{padding:12px 14px;border-top:1px solid var(--line)}
.med:first-child{border-top:0}
.med-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.med-name{font-weight:600;font-size:15px;letter-spacing:-.01em}
.chip{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.fin{background:var(--line);color:var(--muted)}
.chip.last{background:var(--stop-soft);color:var(--stop)}
.med-meta{font-size:13px;color:var(--muted);margin-top:3px}
.bar{height:5px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px}
.med.finished .med-name{opacity:.5}
.med.finished .bar > i{background:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:7px;padding-left:10px;border-left:2px solid var(--line)}
.note.warn{color:var(--warn);border-color:var(--warn)}

.strip{display:flex;gap:4px;padding:14px}
.strip div{flex:1;height:34px;border-radius:5px;background:var(--line);position:relative}
.strip div > i{position:absolute;inset:auto 0 0 0;background:var(--accent);border-radius:5px}
.strip div.future{opacity:.35}
.legend{font-size:12px;color:var(--muted);padding:0 14px 12px}

.visit{display:flex;align-items:center;gap:14px;padding:14px}
.visit .big{font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--accent)}
.visit .t{font-size:14px}
.visit .s{font-size:13px;color:var(--muted);margin-top:2px}

footer{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.5}
footer a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="h-day">—</h1>
      <div class="date-line" id="h-date">—</div>
    </div>
    <div class="day-nav">
      <button class="nav-btn" id="prev" aria-label="Предыдущий день">‹</button>
      <button class="today-btn" id="today">Сегодня</button>
      <button class="nav-btn" id="next" aria-label="Следующий день">›</button>
    </div>
  </header>

  <div id="banners"></div>

  <h2>План на день</h2>
  <div class="card"><ul id="slots"></ul></div>

  <h2>Препараты</h2>
  <div class="card" id="meds"></div>

  <h2>Соблюдение, 14 дней</h2>
  <div class="card">
    <div class="strip" id="strip"></div>
    <div class="legend" id="strip-legend"></div>
  </div>

  <h2>Контроль</h2>
  <div class="card">
    <div class="visit">
      <div class="big" id="visit-num">—</div>
      <div>
        <div class="t" id="visit-t">—</div>
        <div class="s" id="visit-s">—</div>
      </div>
    </div>
  </div>

  <footer>
    <p id="food"></p>
    <p>Напоминания: импортируй <a href="breathe.ics" download>breathe.ics</a> в Календарь — все приёмы и визит к врачу с алертами, до конца курса.</p>
    <p>Данные хранятся только на этом устройстве. Приложение не заменяет назначение врача.</p>
  </footer>
</div>

<script type="module">
import { meds, START, DOCTOR_VISIT, DOCTOR_NAME, FOOD_BAN, iso, parseISO,
         dayIndex, isActive, endISO, slotsFor, courseEndISO } from './schedule.js';

const LS = 'breathe.log.v1';
const load = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } };
const save = (l) => { try { localStorage.setItem(LS, JSON.stringify(l)); } catch {} };
let log = load();

const todayISO = () => iso(new Date());
let view = todayISO();

const RU_M = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const RU_W = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const fmt = (s) => { const d = parseISO(s); return `${d.getDate()} ${RU_M[d.getMonth()]}`; };
const fmtFull = (s) => { const d = parseISO(s); return `${fmt(s)}, ${RU_W[d.getDay()]}`; };
const plural = (n, a, b, c) => {
  const m = n % 100, k = n % 10;
  return m > 10 && m < 20 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c;
};

const done = (date, key) => Boolean(log[date]?.[key]);
function toggle(date, key) {
  const d = (log[date] ||= {});
  if (d[key]) delete d[key]; else d[key] = new Date().toISOString();
  if (!Object.keys(d).length) delete log[date];
  save(log);
  render();
}

const takenCount = (date, med) =>
  med.times.filter((t) => done(date, `${med.id}@${t}`)).length;

const TICK = '<svg viewBox="0 0 20 20"><polyline points="4,10.5 8,14.5 16,5.5"/></svg>';

function render() {
  const isToday = view === todayISO();
  const i = dayIndex(view);
  const lastDay = dayIndex(courseEndISO());

  document.getElementById('h-day').textContent =
    i < 0 ? 'До начала курса' : i > lastDay ? 'Курс завершён' : `День ${i + 1}`;
  document.getElementById('h-date').textContent =
    fmtFull(view) + (isToday ? ' · сегодня' : '');
  document.getElementById('prev').disabled = dayIndex(view) <= 0;
  document.getElementById('next').disabled = dayIndex(view) >= lastDay;
  document.getElementById('today').hidden = isToday;
  document.getElementById('food').textContent = FOOD_BAN;

  // ——— баннеры ———
  const b = [];
  const rinoxil = meds.find((m) => m.id === 'rinoxil');
  for (const m of meds) {
    if (!isActive(m, view)) continue;
    const left = m.days - 1 - i;
    if (left === 0) b.push({ cls: m.id === 'rinoxil' ? 'stop' : 'info',
      t: `Сегодня последний день: ${m.name}`,
      s: m.id === 'rinoxil'
        ? 'Завтра Риноксил отменить полностью. Дальше цепочка начинается сразу с носового душа.'
        : `Курс ${m.days} ${plural(m.days, 'день', 'дня', 'дней')} закончен — завтра не принимать.` });
    else if (left === 1 && m.id === 'rinoxil')
      b.push({ cls: 'warn', t: 'Риноксил: остался 1 день',
        s: 'Максимум 5 дней. Дольше — медикаментозный ринит, отвыкать тяжело.' });
  }
  if (i > 0 && !isActive(rinoxil, view) && dayIndex(view) === rinoxil.days)
    b.push({ cls: 'info', t: 'Риноксил отменён', s: 'День начинается сразу с носового душа, затем гормональный спрей.' });

  const toVisit = dayIndex(DOCTOR_VISIT) - i;
  if (toVisit === 0) b.push({ cls: 'warn', t: 'Сегодня к врачу', s: DOCTOR_NAME });
  else if (toVisit === 1) b.push({ cls: 'warn', t: 'Завтра к врачу', s: DOCTOR_NAME });

  document.getElementById('banners').innerHTML = b.map((x) =>
    `<div class="banner ${x.cls}"><b>${x.t}</b>${x.s}</div>`).join('');

  // ——— слоты дня ———
  const slots = slotsFor(view);
  const now = new Date().toTimeString().slice(0, 5);
  let nextIdx = -1;
  if (isToday) nextIdx = slots.findIndex((s) => !done(view, s.key) && s.time >= now);

  document.getElementById('slots').innerHTML = slots.length
    ? slots.map((s, idx) => `
      <li class="slot ${done(view, s.key) ? 'done' : ''} ${idx === nextIdx ? 'now' : ''}" data-key="${s.key}">
        <span class="time">${s.time}</span>
        <span class="body">
          <span class="name">${s.med.n}. ${s.med.name}</span>
          <span class="sub">${s.med.form} · ${s.med.dose}</span>
        </span>
        <button class="tick" aria-label="Отметить">${TICK}</button>
      </li>`).join('')
    : '<li class="slot"><span class="body"><span class="sub">На этот день приёмов нет.</span></span></li>';

  // ——— препараты ———
  document.getElementById('meds').innerHTML = meds.map((m) => {
    const active = isActive(m, view);
    const finished = i >= m.days;
    const n = takenCount(view, m);
    const target = m.minPerDay ? `${m.minPerDay}–${m.times.length}` : m.times.length;
    const pct = Math.min(100, Math.max(0, ((i + 1) / m.days) * 100));
    const chip = finished
      ? '<span class="chip fin">Завершён</span>'
      : !active ? ''
      : i === m.days - 1 ? '<span class="chip last">Последний день</span>'
      : `<span class="chip">${n}/${target} сегодня</span>`;
    const meta = finished
      ? `Курс ${m.days} ${plural(m.days, 'день', 'дня', 'дней')} закончен ${fmt(endISO(m))}`
      : active
        ? `День ${i + 1} из ${m.days} · до ${fmt(endISO(m))} · ${m.times.join(', ')}`
        : `Начало ${fmt(START)}`;
    return `<div class="med ${finished ? 'finished' : ''}">
      <div class="med-top"><span class="med-name">${m.n}. ${m.name}</span>${chip}</div>
      <div class="med-meta">${meta}</div>
      <div class="bar"><i style="width:${finished ? 100 : pct}%"></i></div>
      ${m.hint && !finished ? `<div class="note">${m.hint}</div>` : ''}
      ${m.warn && !finished ? `<div class="note warn">${m.warn}</div>` : ''}
    </div>`;
  }).join('');

  // ——— полоска соблюдения ———
  const strip = [];
  let sum = 0, counted = 0;
  for (let k = 13; k >= 0; k--) {
    const d = parseISO(view); d.setDate(d.getDate() - k);
    const ds = iso(d), di = dayIndex(ds);
    const tot = slotsFor(ds).length;
    const got = tot ? slotsFor(ds).filter((s) => done(ds, s.key)).length : 0;
    const ratio = tot ? got / tot : 0;
    const future = di > dayIndex(todayISO()) || di < 0;
    if (!future && tot) { sum += ratio; counted++; }
    strip.push(`<div class="${future ? 'future' : ''}" title="${fmt(ds)}: ${got}/${tot}">
      <i style="height:${Math.round(ratio * 100)}%"></i></div>`);
  }
  document.getElementById('strip').innerHTML = strip.join('');
  document.getElementById('strip-legend').textContent = counted
    ? `Средний охват за период: ${Math.round((sum / counted) * 100)}%`
    : 'Пока нет отметок.';

  // ——— визит ———
  const dv = dayIndex(DOCTOR_VISIT) - dayIndex(todayISO());
  document.getElementById('visit-num').textContent = dv > 0 ? dv : dv === 0 ? '!' : '✓';
  document.getElementById('visit-t').textContent = dv > 0
    ? `${plural(dv, 'день', 'дня', 'дней')} до приёма` : dv === 0 ? 'Приём сегодня' : 'Приём прошёл';
  document.getElementById('visit-s').textContent = `${fmtFull(DOCTOR_VISIT)} · ${DOCTOR_NAME}`;
}

document.getElementById('slots').addEventListener('click', (e) => {
  const li = e.target.closest('.slot[data-key]');
  if (li) toggle(view, li.dataset.key);
});
const shift = (n) => { const d = parseISO(view); d.setDate(d.getDate() + n); view = iso(d); render(); };
document.getElementById('prev').onclick = () => shift(-1);
document.getElementById('next').onclick = () => shift(1);
document.getElementById('today').onclick = () => { view = todayISO(); render(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) { log = load(); render(); } });

render();
setInterval(render, 60000);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
